name: CI

# Windows is the ONLY operating system Spark supports, ever (decision D16). The ubuntu leg
# survives that decision and the reason has changed with it — see D18.
#
# It is no longer a rot-guard: there is no cross-platform option left to keep alive, so that
# argument is void. What it is now is a SECOND IMPLEMENTATION OF THE SAME ARITHMETIC. A
# different libc, a different floating-point library and a different culture default have
# already caught a real defect here that Windows could not (NOTES.md N28), and that argument
# never depended on shipping a Linux build.
#
# THE UBUNTU LEG NEVER BUILDS THE NATIVE PROVIDER, and that is what makes it affordable.
# Building OpenCascade for linux-x64 would cost an hour of CI per cache miss to guard a
# platform nobody ships. Instead the leg runs managed-only, and
# `Spark.Geometry.Occt.Tests` skips itself — which turns it into a standing test of the
# supported no-provider configuration (ADR-0021) for free.
#
# macOS is deliberately not built. Shipping there needs a paid Apple Developer account
# and notarization in CI, and under D16 it is not shipped at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer derives the version from the nearest tag, so a shallow clone
          # would produce a wrong version rather than an obvious failure.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ matrix.os }}-

      - name: Restore
        run: dotnet restore Spark.slnx

      # Warnings are errors here and only here. Locally they stay warnings, so that a
      # stray unused variable mid-edit does not train people into passing -warnaserror:false.
      - name: Build
        run: dotnet build Spark.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Spark.slnx --configuration Release --no-build

      # NFR-5, and the window for adding it closes at M1.6 — the commit that first puts
      # native binaries in the tree. A gate added after the thing it guards against is a
      # gate that never guarded. Run on both operating systems because native assets are
      # per-RID: an output clean on one can carry a .so or a .dylib on the other.
      # Invoked through bash rather than executed, because this repository is maintained from
      # Windows with core.filemode=false: a script committed there is mode 100644 and a chmod
      # never reaches the index. The bit is set on this one, and the invocation makes the next
      # one impossible to get wrong. See NOTES.md N28.
      - name: No native binaries in Spark.Geometry
        shell: bash
        run: bash scripts/check-no-native-binaries.sh

  native:
    name: Native provider (win-x64)
    runs-on: windows-latest

    # E13-T15. The shim is built here and nowhere else. The cache key is exactly the build key
    # `scripts/build-native.ps1` writes beside the binaries — (occt-tag, vcpkg-baseline,
    # shim-source-hash, rid) — because the artefact and the thing that identifies it must not be
    # able to disagree. R22 depends on that, and so does the steady-state cost: a run that changes
    # nothing about the shim or the port downloads instead of building.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The three parts of the key, computed before anything is built so the cache can be
      # consulted first. `vcpkg.json` carries the OpenCascade version and the vcpkg baseline;
      # the shim hash is over its own sources, because an edit that is not committed still
      # changes the artefact.
      - name: Compute the build key
        id: key
        shell: pwsh
        run: |
          $manifest = Get-Content native/spark_occt/vcpkg.json -Raw | ConvertFrom-Json
          $occt = ($manifest.overrides | Where-Object { $_.name -eq 'opencascade' }).version
          $baseline = $manifest.'builtin-baseline'

          $files = Get-ChildItem -Path native/spark_occt/include, native/spark_occt/src -File |
              Sort-Object -Property Name
          $joined = ($files | ForEach-Object { (Get-FileHash -Algorithm SHA256 $_.FullName).Hash }) -join ''
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($joined)
          $stream = New-Object System.IO.MemoryStream(, $bytes)
          $shim = (Get-FileHash -Algorithm SHA256 -InputStream $stream).Hash.Substring(0, 16)

          "occt=$occt"                                        >> $env:GITHUB_OUTPUT
          "baseline=$baseline"                                >> $env:GITHUB_OUTPUT
          "shim=$shim"                                        >> $env:GITHUB_OUTPUT
          "key=occt-$occt-$($baseline.Substring(0,12))-$shim-win-x64" >> $env:GITHUB_OUTPUT

      # The OpenCascade install is cached on its own key, without the shim hash: editing the
      # shim must not throw away an hour of dependency build.
      - name: Cache OpenCascade
        id: occt
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: occt-${{ steps.key.outputs.occt }}-${{ steps.key.outputs.baseline }}-win-x64

      - name: Install OpenCascade
        if: steps.occt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host 'Building OpenCascade from the pinned port. This takes about an hour.'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencascade:x64-windows

      - name: Build the shim
        shell: pwsh
        run: ./scripts/build-native.ps1 -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT

      # The staged payload, licences and build key together. E13-T17 measures against this.
      - name: Measure the payload
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem artifacts/native/win-x64 -Recurse -File |
              Measure-Object -Property Length -Sum).Sum
          Write-Host ("staged payload: {0:N1} MB" -f ($bytes / 1MB))

          $key = Get-Content artifacts/native/win-x64/spark_occt.buildkey.json -Raw
          Write-Host $key

      - uses: actions/upload-artifact@v4
        with:
          name: spark_occt-win-x64
          path: artifacts/native/win-x64
          retention-days: 14

      # And the provider's own tests, which SKIP on every other job and must not skip here.
      # A green run that skipped everything is the failure this step exists to catch.
      - name: Test the provider
        shell: pwsh
        run: |
          dotnet build tests/Spark.Geometry.Occt.Tests --configuration Release
          $output = & ./tests/Spark.Geometry.Occt.Tests/bin/Release/net10.0/Spark.Geometry.Occt.Tests.exe
          $output | Write-Host

          $summary = $output | Select-String -Pattern 'Total: (\d+).*Failed: (\d+).*Skipped: (\d+)'

          if (-not $summary) { throw 'The provider tests printed no summary.' }

          $failed = [int]$summary.Matches[0].Groups[2].Value
          $skipped = [int]$summary.Matches[0].Groups[3].Value

          if ($failed -ne 0) { throw "$failed provider test(s) failed." }
          if ($skipped -ne 0) { throw "$skipped provider test(s) SKIPPED - the shim was not found." }

  # E12-T14. A runnable build from every push to main, not only at 1.0, which is R2's stated
  # mitigation: "is it releasable" is a question answered continuously rather than discovered at
  # the end. It stages the full thing - the application, the CLI and the native provider taken
  # from the job above - packs the deterministic portable zip, and then RUNS what it packed.
  #
  # Running it is the part that matters. A staged folder that is missing one assembly still
  # uploads perfectly, and nothing else in this file would notice.
  portable:
    name: Portable build (win-x64)
    runs-on: windows-latest
    needs: native
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer again: a shallow clone stamps 0.0.0-alpha.0 on an artefact that is then
          # uploaded under a real-looking name. scripts/check-version.ps1 exists for the
          # release path; here the fix is simply to fetch the tags.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: spark_occt-win-x64
          path: artifacts/native/win-x64

      - name: Stage
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Pack the portable zip
        shell: pwsh
        run: ./scripts/pack-portable.ps1

      # OUTSIDE THE WORKSPACE, and that is the entire point of this step.
      #
      # OcctKernel walks up from the executable looking for artifacts/native/win-x64, which is a
      # deliberate convenience for developers running out of a build tree. It also means a check
      # run from inside the repository proves nothing: the shim is sitting right there, in the
      # folder the download-artifact step above just filled, and a zip missing every native DLL
      # would pass. That was measured - a staged build with no native payload at all exported
      # solids successfully from inside the tree, and failed with SPK1080 from outside it.
      #
      # And --version is no better: it prints the provider's name either way. What distinguishes
      # them is doing something that needs the kernel.
      - name: Run what was packed, from outside the tree
        shell: pwsh
        run: |
          $zip = 'artifacts/spark-portable-win-x64.zip'
          $graph = Join-Path (Get-Location) 'docs/examples/solids.spark'
          $outside = Join-Path $env:RUNNER_TEMP 'packed'
          $step = Join-Path $env:RUNNER_TEMP 'packed.step'

          if (Test-Path $outside) { Remove-Item -LiteralPath $outside -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $outside -Force

          & (Join-Path $outside 'spark.exe') export --open $graph --out $step | Write-Host

          if ($LASTEXITCODE -ne 0) {
              throw "the packed build could not export solids, so the native payload did not travel with it."
          }

          if (-not (Test-Path $step)) { throw 'no STEP file was written.' }

          Write-Host ("wrote {0:N0} bytes of STEP" -f (Get-Item $step).Length)

      - uses: actions/upload-artifact@v4
        with:
          name: spark-portable-win-x64
          path: |
            artifacts/spark-portable-win-x64.zip
            artifacts/spark-portable-win-x64.zip.sha256
          retention-days: 14

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify formatting
        run: dotnet format Spark.slnx --verify-no-changes --severity warn

  docs-freshness:
    name: Documentation freshness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    # Enforces the client's standing instruction mechanically rather than by request.
    # If a change touches the public API surface or the node library, it must also touch
    # docs/. The escape hatch is deliberate and deliberately loud: a `docs: none-needed`
    # trailer in a commit message is visible in review, where a silent exemption would not be.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check that code changes are accompanied by documentation
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)

          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # Any contract surface, not just the node library. An earlier version keyed only
          # on Spark.Nodes and the API baselines, so the entire geometry kernel could change
          # without tripping the gate - which is exactly what happened on its first real use.
          needs_docs=$(echo "$changed" | grep -E '^(src/Spark\.(Api|Geometry|Geometry\.Io|Nodes\.Core)/.*\.cs|.*PublicAPI\.(Shipped|Unshipped)\.txt)$' || true)
          touched_docs=$(echo "$changed" | grep -E '^(docs/|README\.md|AGENTS\.md)' || true)

          if [ -n "$needs_docs" ] && [ -z "$touched_docs" ]; then
            if git log "$base"..HEAD --format=%B | grep -qi '^docs: none-needed'; then
              echo "::notice::Documentation exemption claimed via 'docs: none-needed' trailer."
              exit 0
            fi
            echo "::error::This change touches the public API surface or the node library but no documentation."
            echo "Update the relevant documents, or add a 'docs: none-needed' trailer to a commit and say why."
            echo "Offending files:"
            echo "$needs_docs" | sed 's/^/  /'
            exit 1
          fi

          echo "Documentation freshness check passed."
