name: Nightly

# The schedule that turns three measurements into three guards (E8-T15, and the open half of
# E4-T3). The benchmark project has existed since ab2f37e and nothing ran it, so it measured
# rather than guarded: a number nobody compares to anything cannot go red.
#
# This is deliberately NOT in ci.yml. A full BenchmarkDotNet run is fifteen to twenty minutes per
# operating system, which is more than the entire pull-request build costs today, and a gate that
# slow gets bypassed rather than fixed. Nightly is the right cadence for a guard whose job is to
# name the day something changed, not to block a commit.
#
# Two things follow from running on hosted runners, and both are in bench/budgets.jsonc rather
# than assumed here: allocation figures are deterministic and are budgeted tightly, and wall-clock
# figures are not and are budgeted to catch a step change only.
#
# GitHub disables a scheduled workflow after 60 days without repository activity, and says so by
# email. If this stops running, that is the first thing to check.

on:
  schedule:
    # 03:00 UTC daily. The hour is arbitrary; the minute deliberately is not zero, because the
    # top of the hour is when hosted runners are most contended and this job measures time.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  benchmarks:
    name: Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # RAISED FROM 60 WHEN THE TESSELLATION MEASUREMENT ARRIVED, AND THE OLD VALUE WAS A TRAP.
    #
    # The Windows leg can now build OpenCascade from the pinned port, which takes about an hour on
    # a cold cache - so a 60-minute job would be killed by the timeout on exactly the run that
    # needed to build it, and pass on every run that did not. A limit that only fires when the work
    # is real is worse than none.
    timeout-minutes: 180

    # Both operating systems, for the same reason ci.yml builds both — and here it is not merely
    # a rot-guard: allocation is the half of these budgets that is machine-independent, so a
    # Linux leg genuinely re-tests it rather than repeating it. The canvas benchmark is Windows
    # only; see the step itself.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer derives the version from the nearest tag, so a shallow clone would produce a
          # wrong version rather than an obvious failure.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ matrix.os }}-

      # Release is not optional and BenchmarkDotNet refuses to produce numbers without it: an
      # unoptimised measurement is not a slower measurement, it is a different program.
      - name: Run the benchmark suites
        run: >
          dotnet run --project bench/Spark.Benchmarks --configuration Release --
          --filter '*'
          --exporters json
          --artifacts artifacts/benchmarks

      # ADR-0013's own number, measured through a real window and a real compositor, which is why
      # it cannot be a BenchmarkDotNet case. Windows only: the Linux runner has no display server,
      # and driving Avalonia under xvfb would measure a software rasteriser nobody ships on.
      #
      # UNPROVEN ON A HOSTED RUNNER as of this commit — it has only ever been run on a developer
      # machine, where it takes 0.87 ms median at 2,000 nodes. If the first nightly cannot open a
      # window, the honest fixes are to make the measurement headless or to delete this step. Do
      # not reach for continue-on-error: a step allowed to fail is not a guard, and the budgets
      # file would then be checking something nobody runs.
      - name: Canvas benchmark, 2 000 nodes
        if: runner.os == 'Windows'
        shell: bash
        run: dotnet run --project src/Spark.Desktop --configuration Release -- --canvas-benchmark 600 | tee canvas.log

      # E12-T19'S MEASUREMENT NEEDS THE SOLID-MODELLING KERNEL, SO THE WINDOWS LEG BUILDS THE SHIM.
      #
      # `tessellate` is a verb rather than a BenchmarkDotNet case precisely because it needs a
      # provider: a case would run without one, measure a failed operation and report an excellent
      # time. So the kernel has to be here, and these four steps are `ci.yml`'s native job with the
      # same cache key — the OpenCascade version and the vcpkg baseline out of the port manifest —
      # which makes this a restore rather than an hour, as long as CI has run since the port moved.
      #
      # The Linux leg says `--no-tessellation` instead, and says it deliberately: the shim is
      # win-x64 and `build-native.ps1` is a vcpkg script. A budgeted-but-unmeasured number is a
      # failure unless a run states the omission, which is what stopped this from being wired with
      # a shrug in the first place — and what turned the first nightly red on both legs.
      # Before the install rather than after it, for the reason `ci.yml` gives at the same step:
      # the runner's default C++ compiler is MinGW, it cannot link MSVC-built OpenCascade, and
      # finding that out costs an hour of dependency build if nobody asks first.
      - name: Check the C++ toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1 -CheckToolchain

      - name: Compute the OpenCascade key
        if: runner.os == 'Windows'
        id: occtkey
        shell: pwsh
        run: |
          $manifest = Get-Content native/spark_occt/vcpkg.json -Raw | ConvertFrom-Json
          $occt = ($manifest.overrides | Where-Object { $_.name -eq 'opencascade' }).version

          "occt=$occt"                                >> $env:GITHUB_OUTPUT
          "baseline=$($manifest.'builtin-baseline')"  >> $env:GITHUB_OUTPUT

      - name: Cache OpenCascade
        if: runner.os == 'Windows'
        id: occt
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: occt-${{ steps.occtkey.outputs.occt }}-${{ steps.occtkey.outputs.baseline }}-win-x64

      - name: Install OpenCascade
        if: runner.os == 'Windows' && steps.occt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host 'Building OpenCascade from the pinned port. This takes about an hour.'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencascade:x64-windows

      - name: Build the native provider
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1 -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT

      # Run from the repository root, where the kernel resolver finds the staged shim in
      # artifacts/native. The verb prints one line the check parses; `tee` keeps it and still shows
      # it in the log, so a regression is readable without downloading an artefact.
      - name: Tessellation measurement
        if: runner.os == 'Windows'
        shell: bash
        run: >
          dotnet run --project bench/Spark.Benchmarks --configuration Release --
          tessellate | tee tessellation.log

      # The check is a verb on the benchmark host rather than a shell script, so that it reads the
      # same JSON on both operating systems without a jq dependency, and so that it can be run
      # locally exactly as CI runs it. --no-canvas is how a run states that it deliberately did not
      # measure the canvas; without it a budgeted-but-unmeasured canvas is a failure, which is what
      # stops this quietly degrading into a benchmarks-only guard.
      - name: Check the run against the budgets
        shell: bash
        run: |
          if [ -f canvas.log ]; then
            canvas=(--canvas canvas.log)
          else
            canvas=(--no-canvas)
          fi

          if [ -f tessellation.log ]; then
            tessellation=(--tessellation tessellation.log)
          else
            tessellation=(--no-tessellation)
          fi

          dotnet run --project bench/Spark.Benchmarks --configuration Release --no-build -- \
            check --results artifacts/benchmarks/results "${canvas[@]}" "${tessellation[@]}"

      # Kept whether the check passed or failed. The failure message names the case and the
      # ceiling; the reports are what let somebody see how far and since when.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports-${{ matrix.os }}
          path: |
            artifacts/benchmarks/results/
            tessellation.log
            canvas.log
          retention-days: 30
          if-no-files-found: warn
