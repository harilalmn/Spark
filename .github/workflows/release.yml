name: Release

# E12-T11. Cuts a release from a tag, and refuses to cut one when the artefact disagrees with the
# tag it is being released under.
#
# THE GATE IS THE POINT OF THIS FILE. Spark's version comes from MinVer, derived from the nearest
# git tag (ADR-0007), so in principle a tag and its assemblies cannot disagree. In practice there
# is exactly one way they can, and it is the default: a shallow checkout has no tags, MinVer finds
# none, every assembly is stamped 0.0.0-alpha.0, and the workflow publishes them as v1.0.0. That
# release installs, runs, and makes every bug report from it name a version that does not exist.
#
# So `fetch-depth: 0` below is load-bearing rather than tidy, and scripts/check-version.ps1 reads
# the version back out of the built assembly afterwards. Belt and braces, because the belt is a
# YAML line that a future edit can drop without anything failing until release day.
#
# The release PUBLISHES. It drafted until 2026-09-02, on the reasoning that signing and the
# installer needed a person and a workflow that published would be claiming they had happened. The
# installer is now built here (scripts/pack-installer.ps1), and the client asked for one word -
# "release" - to produce a downloadable one, so the draft step was a hand-crank in the middle of an
# automated pipeline.
#
# WHAT IS STILL NOT TRUE, AND IS SAID IN THE RELEASE NOTES RATHER THAN HIDDEN: nothing is signed.
# The installer and the executables carry no Authenticode signature, so the first run shows a
# SmartScreen warning. That needs an identity to sign with and is the remaining half of E13-T17.
# Publishing does not claim otherwise; it claims a build exists, which it does.
#
# A tag with a hyphen in it - v0.2.0-beta.1 - is published as a PRERELEASE, so "Latest release"
# on the repository front page and the update check inside the application both keep pointing at
# the last stable one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, for a dry run.
        required: true

permissions:
  contents: write

env:
  # Named here so the release notes and installer/spark.iss cannot disagree about which runtime a
  # user is being asked to install.
  SPARK_DOTNET: '10'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Release (win-x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Load-bearing. See the note at the top of this file.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The gates, in full. A release is not the moment to trust that CI ran on this commit:
      # a tag can be moved, and a workflow_dispatch can name any tag at all.
      - name: Build
        run: dotnet build Spark.slnx --configuration Release --no-incremental -warnaserror

      - name: Test
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem tests -Directory | ForEach-Object {
              $exe = Join-Path $_.FullName "bin/Release/net10.0/$($_.Name).exe"
              if (-not (Test-Path $exe)) { return }

              & $exe | Write-Host
              if ($LASTEXITCODE -ne 0) { $failed++ }
          }

          if ($failed -ne 0) { throw "$failed test project(s) failed." }

      - name: Verify formatting
        run: dotnet format Spark.slnx --verify-no-changes --severity warn

      # OPENCASCADE HAS TO BE INSTALLED HERE, AND THE FIRST RELEASE FOUND OUT THE HARD WAY.
      #
      # `v0.1.0` called build-native.ps1 straight, as a developer machine can: there, vcpkg has
      # OpenCascade in it already. A hosted runner has vcpkg at C:\vcpkg and **no ports built**, so
      # the script found a vcpkg without OpenCascade and stopped - before the installer, before the
      # publish, and therefore before the release page had anything on it but source archives.
      #
      # This is `ci.yml`'s native job, copied deliberately rather than factored out: the two are
      # allowed to diverge (CI measures the payload, this one ships it), and a shared composite
      # action that silently changed both is a worse failure than two files that agree by review.
      # The cache key is the OpenCascade version and the vcpkg baseline out of the port manifest,
      # without the shim hash - editing the shim must not throw away an hour of dependency build.
      - name: Compute the OpenCascade key
        id: occtkey
        shell: pwsh
        run: |
          $manifest = Get-Content native/spark_occt/vcpkg.json -Raw | ConvertFrom-Json
          $occt = ($manifest.overrides | Where-Object { $_.name -eq 'opencascade' }).version

          "occt=$occt"                                >> $env:GITHUB_OUTPUT
          "baseline=$($manifest.'builtin-baseline')"  >> $env:GITHUB_OUTPUT

      - name: Cache OpenCascade
        id: occt
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: occt-${{ steps.occtkey.outputs.occt }}-${{ steps.occtkey.outputs.baseline }}-win-x64

      - name: Install OpenCascade
        if: steps.occt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host 'Building OpenCascade from the pinned port. This takes about an hour.'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencascade:x64-windows

      - name: Build the native provider
        shell: pwsh
        run: ./scripts/build-native.ps1 -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT

      - name: Stage
        shell: pwsh
        run: ./scripts/publish.ps1

      # The gate. Reads the version out of the artefact rather than out of the build inputs,
      # because the artefact is what ships.
      - name: The tag and the artefact must agree
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ github.event.inputs.tag }}'
          } else {
              '${{ github.ref_name }}'
          }

          ./scripts/check-version.ps1 -Tag $tag

      - name: Pack the portable zip
        shell: pwsh
        run: ./scripts/pack-portable.ps1

      # Inno Setup is preinstalled on windows-latest, which is most of why it was chosen: no
      # tooling step, nothing to pin, nothing to go stale. pack-installer.ps1 finds ISCC itself and
      # fails with a sentence naming what to install if the image ever drops it.
      - name: Pack the installer
        shell: pwsh
        run: ./scripts/pack-installer.ps1

      # Same reasoning as the CI job: run it from outside the tree, or the kernel resolver finds
      # the shim in artifacts/native and a zip missing every native DLL passes.
      - name: Run what was packed, from outside the tree
        shell: pwsh
        run: |
          $graph = Join-Path (Get-Location) 'docs/examples/solids.spark'
          $outside = Join-Path $env:RUNNER_TEMP 'packed'
          $step = Join-Path $env:RUNNER_TEMP 'packed.step'

          if (Test-Path $outside) { Remove-Item -LiteralPath $outside -Recurse -Force }
          Expand-Archive -LiteralPath 'artifacts/spark-portable-win-x64.zip' -DestinationPath $outside -Force

          & (Join-Path $outside 'spark.exe') export --open $graph --out $step | Write-Host

          if ($LASTEXITCODE -ne 0) {
              throw 'the packed build could not export solids, so the native payload did not travel with it.'
          }

      # The installer is the thing a user runs, so it is named first in the notes and attached
      # first. The portable zip stays, and stays documented, because "unzip it anywhere" is the
      # only option on a locked-down machine where nothing may be installed.
      # The installer is what a user runs, so it is named first in the notes and attached first.
      # The portable zip stays, and stays documented, because "unzip it anywhere" is the only
      # option on a machine where nothing may be installed.
      - name: Publish the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $installer = Get-ChildItem artifacts/spark-*-setup.exe | Select-Object -First 1

          if (-not $installer) { throw 'No installer was produced, so there is nothing to release.' }

          # The template's leading HTML comment is for whoever edits it, not for whoever reads
          # the release. Stripped before substitution, or the placeholders inside the comment get
          # substituted too and it stops making sense to the next editor.
          $notes = (Get-Content .github/release-notes.md -Raw -Encoding utf8) -replace '(?s)^<!--.*?-->\s*', ''
          $notes = $notes.Replace('{INSTALLER}', $installer.Name).Replace('{DOTNET}', $env:SPARK_DOTNET)

          Set-Content -LiteralPath notes.md -Value $notes -Encoding utf8

          $arguments = @(
              'release', 'create', $tag,
              '--title', $tag,
              '--notes-file', 'notes.md',
              '--generate-notes'
          )

          # A hyphen in a SemVer tag is what makes it a prerelease, and GitHub will not work that
          # out on its own. Getting this wrong points "Latest release" - and the update check
          # inside the application - at a beta.
          if ($tag -match '-') {
              $arguments += '--prerelease'
              Write-Host "$tag is a prerelease."
          }

          $arguments += @(
              $installer.FullName
              "$($installer.FullName).sha256"
              'artifacts/spark-portable-win-x64.zip'
              'artifacts/spark-portable-win-x64.zip.sha256'
          )

          & gh @arguments

          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with $LASTEXITCODE." }

      - uses: actions/upload-artifact@v4
        with:
          name: spark-release-win-x64
          path: |
            artifacts/spark-*-setup.exe
            artifacts/spark-*-setup.exe.sha256
            artifacts/spark-portable-win-x64.zip
            artifacts/spark-portable-win-x64.zip.sha256
          retention-days: 90
